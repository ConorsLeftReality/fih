<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fih</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<pre id="food">*</pre>
<script>
(() => {
  // Tail fin alternates between > and | so each fish paddles.
  const RIGHT = ["><((o>", "|<((o>"];
  const LEFT = ["<o))><", "<o))>|"];
  const WAVE_PX = 0.5;   // how far each letter bobs
  const MAX_SPEED = 1.7, MIN_SPEED = 0.6;
  const SIGHT = 110;     // how far a fish can see its neighbours
  const PERSONAL = 38;   // how close is too close
  const MAX_TILT = 0.2;  // radians
  const STUN_MS = 2000;  // how long a fish stays dazed after bumping the cursor
  const REJOIN_MS = 4000; // how long it then hurries back to the school

  const W = () => innerWidth, H = () => innerHeight;
  const count = Math.round(Math.min(40, Math.max(14, (W() * H()) / 35000)));

  // A slowly drifting point the school loosely follows, made from layered sines
  // so its path never quite repeats.
  function lure(t) {
    return {
      x: W() / 2 + W() * 0.32 * Math.sin(t * 0.00021) + W() * 0.08 * Math.sin(t * 0.00053 + 1),
      y: H() / 2 + H() * 0.28 * Math.sin(t * 0.00031 + 2) + H() * 0.07 * Math.cos(t * 0.00071),
    };
  }

  const fishes = [];
  const start = lure(0);
  for (let i = 0; i < count; i++) {
    const el = document.createElement("pre");
    el.className = "fish";
    const chars = [...RIGHT[0]].map(c => {
      const s = document.createElement("span");
      s.textContent = c;
      return el.appendChild(s);
    });
    document.body.appendChild(el);
    const a = Math.random() * Math.PI * 2;
    fishes.push({
      el, chars,
      x: start.x + Math.cos(a) * 120 * Math.random(),
      y: start.y + Math.sin(a) * 80 * Math.random(),
      vx: 1 + Math.random() * 0.5, vy: (Math.random() - 0.5) * 0.6,
      right: true, tilt: 0,
      paddle: Math.random() * 2, wave: Math.random() * 10,
      pace: 0.85 + Math.random() * 0.3,           // some fish are a touch quicker
      stunUntil: 0,
    });
  }
  const w = fishes[0].el.offsetWidth, h = fishes[0].el.offsetHeight;
  const GAP_X = 6, GAP_Y = 3; // minimum space between fish boxes

  // Nudge apart any two fish whose boxes overlap, along the shorter overlap.
  function unOverlap() {
    for (let i = 0; i < fishes.length; i++) {
      for (let j = i + 1; j < fishes.length; j++) {
        const a = fishes[i], b = fishes[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const ox = w + GAP_X - Math.abs(dx), oy = h + GAP_Y - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;
        if (ox < oy) {
          const s = (dx < 0 ? -1 : 1) * ox / 2;
          a.x -= s; b.x += s;
        } else {
          const s = (dy < 0 ? -1 : 1) * oy / 2;
          a.y -= s; b.y += s;
        }
      }
    }
  }
  // Spread the starting crowd out before the first frame.
  for (let k = 0; k < 60; k++) unOverlap();

  // While a mouse is over the page, the cursor becomes a speck of food the school follows.
  const food = document.getElementById("food");
  const mouse = { x: 0, y: 0, on: false };
  addEventListener("pointermove", e => {
    if (e.pointerType !== "mouse") return;
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true;
    food.style.display = "block";
    food.style.transform = `translate(${e.clientX - food.offsetWidth / 2}px, ${e.clientY - food.offsetHeight / 2}px)`;
  });
  const hideFood = () => { mouse.on = false; food.style.display = "none"; };
  document.documentElement.addEventListener("mouseleave", hideFood);
  addEventListener("blur", hideFood);

  let last = performance.now();
  function step(now) {
    // rAF timestamps can be slightly earlier than performance.now(), so never go negative.
    const dt = Math.max(0, Math.min(3, (now - last) / 16.67));
    last = now;
    const goal = mouse.on ? mouse : lure(now);
    const pull = mouse.on ? 0.0004 : 0.00012;
    const margin = 70;

    // Where the healthy part of the school is, for stunned fish to swim back to.
    let schoolX = 0, schoolY = 0, healthy = 0;
    for (const f of fishes) {
      if (now < f.stunUntil) continue;
      schoolX += f.x; schoolY += f.y; healthy++;
    }
    if (healthy) { schoolX /= healthy; schoolY /= healthy; }

    for (const f of fishes) {
      // Bumping into the cursor knocks a fish back and stuns it.
      if (mouse.on && now >= f.stunUntil &&
          Math.abs(mouse.x - f.x) < w / 2 + 2 && Math.abs(mouse.y - f.y) < h / 2 + 2) {
        f.stunUntil = now + STUN_MS;
        const kx = f.x - mouse.x, ky = f.y - mouse.y, kd = Math.hypot(kx, ky) || 1;
        f.vx = (kx / kd) * 1.5; f.vy = (ky / kd) * 1.5;
      }
      if (now < f.stunUntil) {
        // Stunned: no paddling, just drift to a stop.
        const drag = Math.pow(0.95, dt);
        f.vx *= drag; f.vy *= drag;
        f.x = Math.max(0, Math.min(W(), f.x + f.vx * dt));
        f.y = Math.max(0, Math.min(H(), f.y + f.vy * dt));
        continue;
      }

      let sepX = 0, sepY = 0, aliX = 0, aliY = 0, cohX = 0, cohY = 0, n = 0;
      for (const o of fishes) {
        if (o === f || now < o.stunUntil) continue;
        // Fish are wide and flat, so squash horizontal distance.
        const dx = (o.x - f.x) * 0.55, dy = o.y - f.y;
        const d = Math.hypot(dx, dy);
        if (d > SIGHT) continue;
        n++;
        aliX += o.vx; aliY += o.vy;
        cohX += o.x; cohY += o.y;
        if (d < PERSONAL && d > 0) {
          const push = (PERSONAL - d) / PERSONAL;
          sepX -= (dx / d) * push; sepY -= (dy / d) * push;
        }
      }
      let ax = sepX * 0.2, ay = sepY * 0.2;
      if (n) {
        ax += (aliX / n - f.vx) * 0.03 + (cohX / n - f.x) * 0.0003;
        ay += (aliY / n - f.vy) * 0.03 + (cohY / n - f.y) * 0.0003;
      }
      ax += (goal.x - f.x) * pull;
      ay += (goal.y - f.y) * pull;

      // Just woke up from a stun: hurry back to the school.
      if (f.stunUntil && now < f.stunUntil + REJOIN_MS && healthy) {
        const rx = schoolX - f.x, ry = schoolY - f.y, rd = Math.hypot(rx, ry);
        if (rd > 60) { ax += (rx / rd) * 0.08; ay += (ry / rd) * 0.08; }
      }

      // Turn gently away from the edges.
      if (f.x < margin) ax += (margin - f.x) * 0.002;
      if (f.x > W() - margin) ax -= (f.x - (W() - margin)) * 0.002;
      if (f.y < margin) ay += (margin - f.y) * 0.002;
      if (f.y > H() - margin) ay -= (f.y - (H() - margin)) * 0.002;

      // A little personal wander so the school breathes.
      ax += (Math.random() - 0.5) * 0.02;
      ay += (Math.random() - 0.5) * 0.02;

      f.vx += ax * dt;
      f.vy += ay * dt;
      f.vy *= 0.985; // fish prefer swimming level

      const max = MAX_SPEED * f.pace;
      let sp = Math.hypot(f.vx, f.vy);
      if (sp > max) { f.vx *= max / sp; f.vy *= max / sp; sp = max; }
      if (sp < MIN_SPEED) { const k = MIN_SPEED / (sp || 1); f.vx *= k; f.vy *= k; sp = MIN_SPEED; }

      f.x += f.vx * dt;
      f.y += f.vy * dt;

      if (f.vx > 0.2) f.right = true;
      else if (f.vx < -0.2) f.right = false;

      const target = f.right ? Math.atan2(f.vy, f.vx) : Math.atan2(-f.vy, -f.vx);
      const clamped = Math.max(-MAX_TILT, Math.min(MAX_TILT, target));
      f.tilt += (clamped - f.tilt) * 0.08 * dt;
    }

    // Fish that bump into each other get pushed apart rather than overlapping.
    unOverlap();
    unOverlap();

    for (const f of fishes) {
      const sp = Math.hypot(f.vx, f.vy);
      const stunned = now < f.stunUntil;
      // Paddle and wave faster when swimming faster; a stunned fish stops paddling.
      if (!stunned) f.paddle += sp * 0.05 * dt;
      f.wave += (stunned ? 0.03 : 0.08 + sp * 0.04) * dt;

      const frames = f.right ? RIGHT : LEFT;
      let text = frames[Math.floor(f.paddle) % 2];
      if (stunned) text = text.replace("o", "?");
      const dir = f.right ? 1 : -1;
      for (let i = 0; i < f.chars.length; i++) {
        const s = f.chars[i];
        if (s.textContent !== text[i]) s.textContent = text[i];
        const y = Math.sin(f.wave + dir * i * 0.9) * WAVE_PX;
        s.style.transform = `translateY(${y.toFixed(2)}px)`;
      }
      f.el.style.transform =
        `translate(${(f.x - w / 2).toFixed(1)}px, ${(f.y - h / 2).toFixed(1)}px) rotate(${f.tilt.toFixed(3)}rad)`;
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
